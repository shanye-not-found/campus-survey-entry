<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <title>校园拾光 · 审阅入口</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>校园拾光 · 审阅入口</h1>
      <p>请连接与服务电脑可以互访的校园网络，再进入审阅。</p>
      <section aria-labelledby="address-heading">
        <h2 id="address-heading">当前访问地址</h2>
        <p id="status" role="status" aria-live="polite">正在读取最新地址…</p>
        <p id="updated" hidden></p>
        <ul id="addresses" aria-label="访问地址列表"></ul>
        <button id="refresh" type="button">刷新地址</button>
        <p id="feedback" role="status" aria-live="polite"></p>
      </section>
      <p class="note">此页展示启动器最近上报的记录，不代表实时在线状态。若无法打开，请联系服务电脑的使用者确认已启动，并检查校园网络是否允许设备互访。</p>
      <p class="note">仅地址信息发布到此页；问卷和照片由服务电脑提供。</p>
      <noscript>请启用 JavaScript 后读取最新地址。</noscript>
    </main>
  </body>
</html>
